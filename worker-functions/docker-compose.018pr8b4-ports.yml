# Override de portas para a rodada A4 do PR-8b (018-pr8b-criar-editar), projeto docker `pr8b4`.
# Portas escolhidas em 15/09 por `grep` em todos os docker-compose*.yml das worktrees (livres):
# 5432/3/40/65/68/71, 55432, 8080/1/180/280/283, 58080 já ocupadas por outras worktrees.
services:
  postgres:
    container_name: pr8b4-postgres
    # 5433, não uma porta "livre" qualquer: `assertLocalDatabaseTarget.ts` (trava contra escrever
    # em stg/prd via cloud-sql-proxy) só aceita 5432/5433 — `scripts/ingest-icd11-catalog.ts`
    # (Fase 2) recusa qualquer outra porta com "TRAVA: porta X não é a do docker local" (medido
    # em 5575 antes desta troca). 5433 estava livre (`lsof` checado em 15/09).
    ports: !override
      - "5433:5432"
  api:
    container_name: pr8b4-api
    ports: !override
      - "8385:8080"
