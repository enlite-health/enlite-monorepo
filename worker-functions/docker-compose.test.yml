# Override para ambiente de testes E2E locais.
#
# Stacks disponíveis:
#   Mock Auth (padrão):
#     docker compose -f docker-compose.yml -f docker-compose.test.yml up -d postgres api
#
#   Firebase Emulator (prod-like):
#     docker compose -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.firebase.yml up -d postgres firebase-emulator api
#
# NÃO usar em produção.

services:
  postgres:
    image: postgis/postgis:16-3.4
    ports:
      - "5433:5432"

  firebase-emulator:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./firebase.json:/app/firebase.json
      - ./storage.rules:/app/storage.rules
      - firebase_emulator_data:/root/.cache/firebase
    command: >
      sh -c "apk add --no-cache openjdk21-jre-headless &&
             npm install -g firebase-tools@latest --quiet &&
             firebase emulators:start --only auth,storage
             --project demo-enlite-test
             --export-on-exit /root/.cache/firebase"
    ports:
      - "9099:9099"
      - "9199:9199"
      - "4000:4000"
    healthcheck:
      # 127.0.0.1, NÃO `localhost`: dentro deste container `localhost` resolve para
      # `::1` (IPv6) antes do IPv4, e o emulador escuta só em 0.0.0.0 (IPv4). O wget
      # do busybox tentava ::1, levava "Connection refused", e o container ficava
      # `unhealthy` PARA SEMPRE — mesmo servindo 200 na porta. Como a API depende
      # de `service_healthy`, isso derrubava a stack inteira no CI (medido 01/09).
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9099 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - enlite-network

  api:
    command: >
      sh -c "node scripts/run-migrations-docker.js && npm start"
    volumes:
      - ./migrations:/app/migrations
      - ./scripts/run-migrations-docker.js:/app/scripts/run-migrations-docker.js
    environment:
      NODE_ENV: test
      USE_MOCK_AUTH: "true"
      USE_CERBOS: "false"
      INTERNAL_TOKEN_SECRET: test-secret-for-e2e-only
      # Libera /api/docs sem requerer staff (somente em test)
      OPENAPI_PUBLIC: "true"
      # Chat IDs do paciente (migration 260): busca de grupos no Periskope.
      #
      # LIGADO por default NESTE arquivo, que é só de teste. A versão anterior
      # vinha desligada e exigia que a pessoa exportasse 4 variáveis à mão antes
      # de rodar — o e2e passava na máquina de quem sabia disso e falhava no CI,
      # que não sabia. Teste que depende de alguém lembrar não é gate, é
      # armadilha. Em produção o default do código continua OFF.
      #
      # PERISKOPE_BASE_URL aponta para o STUB local (porta 9911), nunca para a
      # API de verdade: o e2e não fala com serviço externo vivo. A chave e o
      # telefone são falsos de propósito — existem só para o cliente HTTP ser
      # construído; se algo tentar sair daqui, vai para o stub, que responde 405
      # a tudo que não seja GET /chats.
      PATIENT_CHAT_LOOKUP_ENABLED: ${PATIENT_CHAT_LOOKUP_ENABLED:-true}
      PATIENT_CHAT_IDS_CLICKUP_SYNC_ENABLED: ${PATIENT_CHAT_IDS_CLICKUP_SYNC_ENABLED:-true}
      PERISKOPE_API_KEY: ${PERISKOPE_API_KEY:-stub-key-e2e-only}
      PERISKOPE_PHONE: ${PERISKOPE_PHONE:-5491100000000}
      PERISKOPE_BASE_URL: ${PERISKOPE_BASE_URL:-http://host.docker.internal:9911/v1}
      # Cache DESLIGADO no e2e, de propósito. O cache é bom em produção (um
      # backfill de ~350 pacientes viraria ~350 varreduras da mesma lista), mas
      # no e2e ele torna o teste dependente de ORDEM: um caso popula o cache e o
      # seguinte, que afirma "chegou 1 requisição no Periskope", vê zero.
      # O comportamento do cache é provado por unit (TTL, forceRefresh,
      # clearCache, truncada-não-cacheia). Aqui queremos determinismo.
      PERISKOPE_CHATS_CACHE_TTL_MS: ${PERISKOPE_CHATS_CACHE_TTL_MS:-0}
      # Roster de atendentes de admissão (change agenda-admissao-atendentes).
      #
      # LIGADO aqui, que é arquivo só de teste, pelo mesmo motivo do bloco
      # acima: o e2e tem que exercitar o modo que vai para produção, não o que
      # está sendo substituído. Com a tabela `interview_hosts` vazia — que é
      # como o banco de teste nasce — o endpoint público responde 200 com lista
      # vazia, que é o cenário "país sem atendente ativa" do spec. Sem isto ele
      # responderia 500 por falta de agenda configurada, e o teste passaria
      # aceitando um erro como se fosse resposta.
      #
      # Em produção o default do código continua OFF: a virada é por env, com
      # a tabela já populada (design § Migration Plan).
      ADMISSION_HOST_ROSTER_ENABLED: ${ADMISSION_HOST_ROSTER_ENABLED:-true}
    # host.docker.internal existe sozinho no Docker Desktop (macOS), mas NÃO no
    # Linux do runner do CI — sem isto o container não acha o stub e os testes de
    # candidatos falham só no CI.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  firebase_emulator_data:
