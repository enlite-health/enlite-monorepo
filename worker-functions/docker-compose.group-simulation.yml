# Override dedicado ao e2e de integração da "Simulação de grupo de acesso"
# (`enlite-frontend/e2e/integration/group-simulation.integration.e2e.ts`, spec 026).
#
# Só o service `api`, só as envs que a spec exige por cima do stack padrão
# (`docker-compose.yml` + `docker-compose.test.yml`): engine de permissão ABAC
# ligado com TODAS as 12 famílias em `PERMISSION_ENFORCED_ROUTES` — a simulação
# de grupo precisa que o menu perca telas de verdade e que as rotas dessas
# telas devolvam 403 `missing_cell` quando o grupo simulado não tem a célula,
# em qualquer família, não só `admin.patients` como no override do Ana Care.
#
# Sem `ANACARE_HOURS_SOURCE` — essa spec não mexe em fonte de horas.
#
# ⚠️ Isolamento: como o override do Ana Care, este arquivo é usado SÓ pelo job
# dedicado desta spec. O job padrão de integration segue com o engine
# desligado.
#
# Sem segredo: nenhuma env abaixo é sensível.
services:
  api:
    environment:
      PERMISSION_ENGINE_ENABLED: "true"
      PERMISSION_ENFORCED_ROUTES: "admin.analytics;admin.dedup;admin.encuadre;admin.integrations;admin.messaging;admin.patients;admin.permissions;admin.recruitment;admin.test_fixtures;admin.users;admin.vacancies;admin.workers"
      PERMISSION_CATALOG_SYNC_ENABLED: "true"
      # TTL LIGADO de propósito (era "0"): é a régua que morre se alguém desfizer o
      # conserto da chave de cache versionada por simulação (PermissionService.ts) —
      # com TTL 0 o e2e de integração nunca mediria a lacuna de propagação.
      PERMISSION_CACHE_TTL_MS: "30000"
      # Spec 031 (aba Documentos da ficha): o e2e de tela sobe/baixa arquivo de verdade e o chat anexa
      # PDF. Sem esta env o upload devolve 503 (fail-closed, sem fallback — D-15). O bucket é criado
      # pelo workflow no fake-gcs (`GCS_EMULATOR_HOST` já vem do docker-compose.test.yml); nome só de CI.
      PATIENT_DOCUMENTS_BUCKET: "enlite-patient-documents-ci"
      # Spec 049 (aba Admissão, F9): o e2e de TELA `admissao-049-*` agenda de verdade pelo painel. `ADMISSION_EXTERNALS=fake`
      # troca Calendar, Meet, Twilio, Cloud Tasks, Tactiq, Vertex e cofre por DUBLÊS (nada sai da máquina; a fábrica LANÇA se o
      # modo for `fake` com NODE_ENV=production). `NODE_ENV=test` sozinho mantém o Calendar real — por isso a env é explícita.
      # O dublê do Calendar trata e-mail `ocupado.*` como agenda ocupada. Calendário e templates são valores só de CI.
      ADMISSION_EXTERNALS: "fake"
      ADMISSION_CALENDAR_ID_AR: "cal-ar-e2e049@example.test"
      TWILIO_TEMPLATE_ADMISSION_CONFIRMATION_ES: "HX_CONF_ES_E2E"
      TWILIO_TEMPLATE_ADMISSION_REMINDER_ES: "HX_REM_ES_E2E"
