# Cloud Scheduler job: reconciliação ClickUp→pacientes a cada 10 minutos
# Requires: Cloud Run service running worker-functions exposing POST /api/internal/sync-clickup-patients
#
# Sem query param → mode=cycle (default): janela incremental + retry dos órfãos de
# CASE_NUMBER_CONFLICT. NÃO usar mode=full aqui — a varredura completa leva ~12 min
# (347 tasks × ~2,2s) e não cabe num ciclo de 10 min.
#
# ⚠️ O header era `X-Internal-Token: ${INTERNAL_SYNC_TOKEN}`, que o
# InternalAuthMiddleware NÃO reconhece (ele lê `x-internal-secret`) — daria 403.
# Corrigido para o mesmo padrão dos schedulers que funcionam em produção
# (bulk-dispatch, reminders-sweep). O mesmo erro segue em sync-vacancies.yaml,
# cujo endpoint também ainda não existe.

name: sync-patients-clickup
description: Reconcile ClickUp patients every 10 minutes (incremental window + conflict orphans)
schedule: "*/10 * * * *"
timeZone: America/Argentina/Buenos_Aires
httpTarget:
  uri: ${WORKER_FUNCTIONS_SERVICE_URL}/api/internal/sync-clickup-patients
  httpMethod: POST
  headers:
    Content-Type: application/json
    X-Internal-Secret: ${INTERNAL_TOKEN_SECRET}
  body: e30=  # base64 of '{}'
retryConfig:
  retryCount: 2
  minBackoffDuration: 30s
  maxDoublings: 2
