# Override de portas para a worktree 027-numero-do-caso (Fase 4 — T043/T044).
# Portas escolhidas por `docker ps -a` + `lsof -iTCP -sTCP:LISTEN` em 23/09:
# livres (5432/3/7, 5499, 5434, 5439, 8080, 5000, 8787 já ocupadas por outras
# worktrees/serviços da máquina).
services:
  postgres:
    container_name: 027fase4-postgres
    ports: !override
      - "5679:5432"
  api:
    container_name: 027fase4-api
    ports: !override
      - "8479:8080"
