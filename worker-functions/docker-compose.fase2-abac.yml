# Stack ISOLADO (projeto docker `cv-fase2-abac`) com o engine ABAC LIGADO, para os e2e de tela
# da Fase 2 (`completar-vacante-em-rascunho`) que precisam diferenciar ator COM/SEM as células
# de D426 (`talentum:update` + `vacancy:update`). Não mexe no stack padrão 8080/5432/5173 desta
# worktree (Fase 1 e outras tarefas continuam usando ele sem interrupção) — molde:
# `admin-access-cells-visual.integration.e2e.ts` (comentário de topo).
#
# Reusa a imagem JÁ CONSTRUÍDA `worker-functions-api` (a mesma que roda em `enlite-api`) via
# `image:`, sem rebuild — só troca env/portas.
services:
  postgres:
    container_name: cv-fase2-abac-postgres
    ports: !override
      - "5442:5432"
  api:
    image: worker-functions-api
    container_name: cv-fase2-abac-api
    ports: !override
      - "8092:8080"
    environment:
      CORS_ALLOWED_ORIGINS: "http://localhost:5178"
      PERMISSION_ENGINE_ENABLED: "true"
      PERMISSION_ENFORCED_ROUTES: "admin.analytics,admin.dedup,admin.encuadre,admin.integrations,admin.messaging,admin.patients,admin.permissions,admin.recruitment,admin.test_fixtures,admin.users,admin.vacancies,admin.workers"
      PERMISSION_CATALOG_SYNC_ENABLED: "true"
