# Override de portas para a worktree 027b-en-id (spec 028, caso-en-em-todo-lugar,
# passo 3.1). O jest.config.e2e.js compartilhado exige a API de pé (tests/e2e/setup.ts
# espera GET /health) mesmo para o e2e novo (case-title-caso-en) — sobe os dois, em
# porta/nome próprios. 5627/8227 evitam colisão com enlite-prd-local (5437),
# ebrain-rag-pg (5499), 018-pr* (55xx/81xx) e 021b2 (5570/8171) — conferido via
# `docker ps -a` e `lsof -nP -iTCP:<porta>` antes de escolher (nenhum em uso em
# 24/09/2026).
services:
  postgres:
    container_name: wf027b-postgres
    ports: !override
      - "5627:5432"
  api:
    container_name: wf027b-api
    ports: !override
      - "8227:8080"
