# Stack REAL para a suíte `test:e2e:real-auth` — API sem mock de auth, validando o
# token contra o emulador do Firebase. Roda como um SEGUNDO projeto do compose
# (`-p realauth`), lado a lado com o stack mock da suíte principal, por isso as
# portas do host mudam (o emulador fica nas dele: a suíte principal não o sobe).
#
#   docker compose -p realauth -f docker-compose.yml -f docker-compose.test.yml \
#     -f docker-compose.firebase.yml -f docker-compose.real-auth-ports.yml \
#     up -d postgres firebase-emulator
#   …esperar http://localhost:9099 responder…
#   docker compose -p realauth <os mesmos -f> up -d --no-deps api
#   API_REAL_URL=http://localhost:8081 \
#   DATABASE_URL=postgresql://enlite_admin:enlite_password@localhost:5440/enlite_e2e \
#   FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099 npm run test:e2e:real-auth
services:
  postgres:
    ports: !override
      - "5440:5432"
  api:
    ports: !override
      - "8081:8080"
