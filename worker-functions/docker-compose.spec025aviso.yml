# Stack ISOLADO (projeto docker `spec025aviso`) para o e2e da task T5.6 (spec 025, opção A):
# aviso no app para REGISTERED com data de nascimento inválida. Portas e nome de projeto
# próprios — não disputa com o stack fixo 8089/5439 nem com `docker-compose.spec025.yml`
# (T6.4, edição de birthDate pelo admin), que usa 5540/8290. Molde: `docker-compose.spec025.yml`.
#
# Subir:
#   docker compose -p spec025aviso -f docker-compose.yml -f docker-compose.test.yml \
#     -f docker-compose.spec025aviso.yml up -d postgres api
#
# Derrubar:
#   docker compose -p spec025aviso -f docker-compose.yml -f docker-compose.test.yml \
#     -f docker-compose.spec025aviso.yml down -v
services:
  postgres:
    container_name: spec025aviso-postgres
    ports: !override
      - "5541:5432"
  api:
    container_name: spec025aviso-api
    ports: !override
      - "8291:8080"
    environment:
      CORS_ALLOWED_ORIGINS: "http://localhost:5197"
