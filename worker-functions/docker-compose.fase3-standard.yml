# Stack ISOLADO (projeto docker `cv-fase3-standard`), engine ABAC OFF (default — nenhuma
# variável PERMISSION_* setada), para o e2e `admin-vacancies-edit-routing.integration.e2e.ts`
# da Fase 3 (`completar-vacante-em-rascunho`).
#
# Por que um stack próprio, e não o `enlite-api`/`enlite-postgres` padrão desta worktree: eles
# já estavam DE PÉ (achado em 25/09) servindo o Vite de OUTRA worktree
# (`_worktrees/completar-vacante`, porta 5173 — outro agente lê lá, não pode ser tocado) e o
# `corsConfig.ts` só libera `http://localhost:5173`/`:3000` por padrão — qualquer Vite desta
# worktree noutra porta leva CORS mudo (toda chamada de API falha em silêncio, todo elemento
# que depende de dado nunca aparece). Molde de portas: `docker-compose.fase3-abac.yml` (+10 de
# novo sobre o padrão 5433/8080/5173 → aqui uso a faixa 5472/8122/5193 pra não colidir com
# NENHUM dos outros três stacks vivos ao mesmo tempo — padrão, fase2-abac, fase3-abac).
#
# Reusa a imagem JÁ CONSTRUÍDA `worker-functions-api`, sem rebuild — só troca env/portas.
services:
  postgres:
    container_name: cv-fase3-standard-postgres
    ports: !override
      - "5472:5432"
  api:
    image: worker-functions-api
    container_name: cv-fase3-standard-api
    ports: !override
      - "8122:8080"
    environment:
      CORS_ALLOWED_ORIGINS: "http://localhost:5193"
