# Override do stack local da F9 (emenda 077 "presenca sem furo"): projeto `presenca806`, tudo em 127.0.0.1, portas proprias.
# Uso (de worker-functions/, via e2e/presenca-sem-furo.sh up):
#   docker compose -p presenca806 -f docker-compose.yml -f docker-compose.test.yml -f ../e2e/presenca-sem-furo/override.yml up -d --build postgres att-postgres api
services:
  postgres:
    container_name: pr806-postgres
    ports: !override
      - "127.0.0.1:5671:5432"
  # Postgres do ATTENDANCE (banco proprio, como em prd: Cloud SQL separado). Roles/DB criados por e2e/presenca-sem-furo.sh (pg-local-init.sql do attendance).
  att-postgres:
    image: postgres:15
    container_name: pr806-att-postgres
    environment:
      POSTGRES_PASSWORD: pr806-super-local
      OWNER_PW: pr806-owner-local
      SA_PW: pr806-runtime-local
    ports:
      - "127.0.0.1:5672:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - enlite-network
  api:
    container_name: pr806-api
    ports: !override
      - "127.0.0.1:8671:8080"
    environment:
      FIREBASE_AUTH_EMULATOR_HOST: ""
      CORS_ALLOWED_ORIGINS: "http://localhost:5174,http://127.0.0.1:5174"
      # Engine ABAC LIGADO (o spec da fila exige staff real em grupo); a celula nova entra no catalogo no boot.
      PERMISSION_ENGINE_ENABLED: "true"
      PERMISSION_ENFORCED_ROUTES: "admin.analytics;admin.dedup;admin.encuadre;admin.integrations;admin.messaging;admin.patients;admin.permissions;admin.recruitment;admin.test_fixtures;admin.users;admin.vacancies;admin.workers"
      PERMISSION_CATALOG_SYNC_ENABLED: "true"
      # attendance local (em processo no host, porta 8662). Sem token: `ATTENDANCE_AUTH=none` so vale fora de producao.
      ATTENDANCE_SERVICE_URL: "http://host.docker.internal:8672"
      ATTENDANCE_AUTH: "none"
      # Canal de e-mail: NODE_ENV=test barra o envio (SKIPPED_TEST) E nao ha chave; o SendGrid resolve para 127.0.0.1 (extra_hosts do docker-compose.test.yml).
      SENDGRID_API_KEY: ""
    extra_hosts:
      - "api.sendgrid.com:127.0.0.1"
      - "sendgrid.net:127.0.0.1"
