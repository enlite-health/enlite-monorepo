name: Frontend Integration E2E (reusable)

# Por que este workflow existe
# ─────────────────────────────
# Até 31/08/2026 o Playwright NÃO rodava em CI nenhum — `grep -rn "playwright"
# .github/workflows/` devolvia ZERO. O portão do frontend era lint + vitest, que
# não abrem navegador. Consequência medida: um `<select>` da aba Geral parou de
# disparar o autosave, 50 prestadoras travaram, e as três camadas de teste
# passaram verdes o tempo todo — porque nenhuma exercitava o formulário.
#
# Toda a suíte `e2e/integration/` sobe stack REAL (frontend + backend + Postgres,
# sem mock) e é a única camada que enxerga o vão entre o clique e a requisição
# HTTP. Ela existia e era honor-system: só rodava se alguém lembrasse.
#
# ⚠️ Este job NÃO substitui o `e2e-prod` (monitor das 3h contra produção). Aqui é
# portão de PR, contra stack efêmera; lá é vigilância do que está no ar.

on:
  workflow_call:
    inputs:
      grep:
        description: >
          Filtro opcional de specs. VAZIO = roda a suíte inteira. Quando
          preenchido, o job IMPRIME o que ficou de fora — cobertura reduzida em
          silêncio lê como "está tudo coberto" e foi assim que chegamos aqui.
        required: false
        type: string
        default: ''

jobs:
  integration-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # ── Stack real: Postgres + API + emulador Firebase ──
      #
      # Duas invocações de propósito, e a ORDEM importa:
      #
      # 1. `postgres api` SEM o override do firebase. Esse override troca a API
      #    para `USE_MOCK_AUTH=false` — que não é o modo em que esta suíte roda
      #    (os testes injetam token `mock_*`).
      # 2. o emulador com `--no-deps`. Sem isso o compose exige
      #    `firebase-emulator: condition: service_healthy`, e o healthcheck desse
      #    container está quebrado (aparece `unhealthy` mesmo servindo 200 em
      #    9099 — reproduzido local e no runner). O gate viraria falso-vermelho.
      #    Quem decide se está pronto é a espera por HTTP abaixo, não o healthcheck.
      #
      # O emulador não é opcional: vários specs autenticam por ele e, sem ele,
      # falham em massa com `ECONNREFUSED 127.0.0.1:9099`.
      - name: Sobe Postgres + API + emulador Firebase + fake-gcs
        working-directory: worker-functions
        run: |
          BASE="-f docker-compose.yml -f docker-compose.test.yml"
          # `fake-gcs` ANTES da api: a api depende dele para as rotas de foto/documento (spec 018
          # PR-4, conserto #2 da 2ª revisão) e o bucket precisa existir antes do 1º upload — o
          # fake-gcs-server NÃO cria bucket sozinho (404 até o POST explícito).
          docker compose $BASE up -d postgres fake-gcs
          espera() {
            for i in $(seq 1 60); do
              curl -sf "$2" >/dev/null && echo "$1 pronto" && return 0
              sleep 2
            done
            echo "::error::$1 não respondeu em 120s ($2)"
            return 1
          }
          espera "fake-gcs" http://localhost:54443/storage/v1/b || {
            docker compose $BASE logs fake-gcs | tail -50
            exit 1
          }
          curl -sf -X POST http://localhost:54443/storage/v1/b -H 'Content-Type: application/json' \
            -d '{"name":"enlite-patient-photos-ci"}' >/dev/null

          docker compose $BASE up -d api
          docker compose $BASE -f docker-compose.firebase.yml up -d --no-deps firebase-emulator

          espera "api" http://localhost:8080/health || {
            docker compose $BASE logs api | tail -50
            exit 1
          }
          espera "emulador Firebase" http://localhost:9099/ || {
            docker compose $BASE -f docker-compose.firebase.yml logs firebase-emulator | tail -50
            exit 1
          }

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: enlite-frontend/pnpm-lock.yaml

      - name: Instala dependências
        working-directory: enlite-frontend
        run: pnpm install

      - name: Instala o Chromium do Playwright
        working-directory: enlite-frontend
        run: npx playwright install --with-deps chromium

      # A chave do Maps é REAL de propósito: o spec do endereço reproduz o widget
      # do Google, e um fake responderia só o que nós mesmos programássemos —
      # nunca teria pegado o bug do teclado (`place_changed` sem
      # `formatted_address`). Ver worker-address-keyboard.integration.e2e.ts.
      - name: Sobe o dev server
        working-directory: enlite-frontend
        env:
          VITE_API_WORKER_FUNCTIONS_URL: http://localhost:8080
          # Sem isto a home cai em `/api/jobs`, que dispara RASPAGEM REAL de
          # https://jobs.enlite.health/es/ a partir do runner — a mesma classe de
          # dependência de terceiro pela qual `worker-address-keyboard` está fora
          # deste portão. Com `true`, as vagas vêm da API local do próprio stack.
          VITE_USE_PUBLIC_JOBS_API: 'true'
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          # Config do Firebase FALSA de propósito, e nenhum segredo é preciso: o
          # helper de auth desta suíte intercepta `identitytoolkit.googleapis.com`
          # e `securetoken.googleapis.com` com `page.route`, então nenhuma dessas
          # chamadas sai do navegador. O que o app precisa é apenas que
          # `initializeApp` receba um objeto completo — sem estas variáveis o
          # login nem começa e TODOS os specs morrem no `locator.fill` da tela de
          # login (foi assim que a 1ª execução deste job falhou os 5).
          # Localmente isso vem do `.env`, que não existe no runner.
          VITE_FIREBASE_API_KEY: fake-api-key-for-e2e
          VITE_FIREBASE_AUTH_DOMAIN: demo-e2e.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-e2e
          VITE_FIREBASE_STORAGE_BUCKET: demo-e2e.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
          # Spec 018 PR-4 (foto/documento do paciente) — conserto #2 da 2ª revisão: sem esta
          # flag o slot de foto/documentos nunca monta (env.ts, achado item 6 da 1ª revisão) e
          # `patient-photo-documents-pr4.integration.e2e.ts` falha em `patient-photo-file-input`
          # nunca existir no DOM.
          VITE_PATIENT_PHOTO_ENABLED: 'true'
        run: |
          pnpm dev > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173/ >/dev/null && echo "vite pronto" && exit 0
            sleep 2
          done
          echo "::error::Vite não respondeu em 120s"
          tail -50 /tmp/vite.log
          exit 1

      - name: Testes de integração (stack real, zero mock)
        working-directory: enlite-frontend
        env:
          CI: 'true'
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          # `--ignore-snapshots`: este portão mede COMPORTAMENTO (o dado que o
          # usuário digita chega ao banco?), não pixel. E não teria escolha —
          # os baselines versionados são `*-darwin.png`, tirados em macOS; num
          # runner linux o arquivo correspondente não existe e o Playwright
          # reprovaria por ausência de baseline, não por regressão visual.
          # Comparação visual continua sendo feita à mão no macOS.
          if [ -n "${{ inputs.grep }}" ]; then
            echo "::warning::COBERTURA REDUZIDA — rodando apenas: ${{ inputs.grep }}"
            echo "Specs presentes no repositório e NÃO exercitados por esta execução:"
            ls e2e/integration/*.integration.e2e.ts | grep -vE "${{ inputs.grep }}" || true
            npx playwright test --project=integration --ignore-snapshots --grep "${{ inputs.grep }}"
          else
            npx playwright test --project=integration --ignore-snapshots
          fi

      # ── O portão ESTRUTURAL das telas de plantillas (spec 010) ──
      #
      # Por que ele existe: a spec 010 foi entregue em produção sem que NADA na
      # cadeia comparasse a tela construída com o desenho de 31/08. O "termina
      # quando" era comportamental — data-testid, chave de i18n, contagem — e
      # 4679 testes unitários não abrem navegador. O resultado: a modal virou
      # uma caixa no fluxo da página, o compositor virou um CRUD, a tela de
      # detalhe virou um drawer, e nenhum vermelho apareceu.
      #
      # ⚠️ ELE NÃO MEDE PIXEL, e não finge medir. Os baselines versionados são
      # `*-darwin.png`; num runner linux o Playwright reprovaria por AUSÊNCIA de
      # baseline, que não é regressão. Comparação de pixel continua à mão, no
      # macOS, contra os PNGs do desenho.
      #
      # O que ele mede é o que de fato regrediu e independe de plataforma:
      # coluna que some por transbordo, texto que se sobrepõe ao vizinho, modal
      # que não é `position: fixed`, ato irreversível sem a trava do checkbox,
      # detalhe sem endereço próprio. Cada uma dessas medidas foi SABOTADA e
      # ficou vermelha antes de entrar aqui — portão que não morde é teatro.
      - name: Portão visual estrutural — plantillas × desenho
        working-directory: enlite-frontend
        env:
          CI: 'true'
          E2E_BASE_URL: http://localhost:5173
        run: npx playwright test --config=playwright.mocked.config.ts e2e/plantillas-vs-desenho.e2e.ts

      # 🔒 A PROVA VISUAL MOCKADA ENTRA NO CI — e o motivo é um apodrecimento
      # medido, não zelo. Em 02/09 o `template-drafts-visual.e2e.ts` estava
      # VERMELHO havia um dia inteiro e nada avisou: os cinco testes apontavam
      # para `td-input-name`, `td-slug-previsto`, `td-aviso-perimetro` e para a
      # lista de rascunhos, todos removidos na reescrita do compositor. Como
      # nada aqui o executava, não havia como divergir.
      #
      # ⚠️ `--ignore-snapshots` DE PROPÓSITO, e não por preguiça. As baselines
      # são gitignored (`e2e/**-snapshots/`), então a comparação de pixel nunca
      # aconteceu no CI — e não pode acontecer sem antes decidir onde versionar
      # imagens geradas no Linux, que renderiza fonte diferente do macOS. O que
      # apodreceu não foi pixel: foram SELETORES que sumiram. É isso que este
      # passo pega, e pega em segundos.
      #
      # A fidelidade ao desenho continua medida, e por outro instrumento: o
      # `plantillas-pixel-loop` compara `getComputedStyle` dos dois lados, sem
      # imagem nenhuma, e por isso não depende de plataforma.
      - name: Prova visual mockada — as telas de plantillas
        working-directory: enlite-frontend
        env:
          CI: 'true'
          E2E_BASE_URL: http://localhost:5173
        run: |
          npx playwright test --config=playwright.mocked.config.ts --ignore-snapshots \
            e2e/template-drafts-visual.e2e.ts \
            e2e/template-catalog-visual.e2e.ts \
            e2e/template-catalog-detalhe-visual.e2e.ts

      # 🔒 O FUNIL DE BLOQUEADOS ENTRA NO CI — e pela mesma razão do passo acima,
      # medida em 08/09 (D300): estes specs estavam PODRES e nada avisava. Os 13
      # do Kanban navegavam para `/admin/vacancies/:id/kanban`, rota removida do
      # `App.tsx`; asseravam 6 colunas quando são 9, com nomes que mudaram; e
      # mediam atributos de arrasto na tarjeta em vez do wrapper. Como nenhum
      # pipeline os executava, apodreceram em silêncio por meses — enquanto a
      # tela que eles deviam cobrir exibia, em produção, motivo errado em 135 de
      # 1.271 cards.
      #
      # ⚠️ `--ignore-snapshots` pelo mesmo motivo do passo das plantillas: as
      # baselines são geradas no macOS e o Linux renderiza fonte diferente. O que
      # este passo pega é SELETOR e FLUXO — rota que sumiu, coluna renomeada,
      # botão que deixou de existir. É isso que apodreceu, e é em segundos.
      #
      # Nenhum destes toca canal real: a auth é interceptada em `page.route`
      # (`loginAsStaffOffline`), sem emulador e sem conta de produção — que é o
      # requisito para caberem no `playwright.mocked.config.ts`.
      - name: Prova mockada — funil de bloqueados e Kanban da vaga
        working-directory: enlite-frontend
        env:
          CI: 'true'
          E2E_BASE_URL: http://localhost:5173
        run: |
          # Caminho que não existe o Playwright trata como filtro que não casa nada,
          # e SAI ZERO se os outros casarem. Renomear um spec deixaria este passo
          # verde rodando menos — cobertura reduzida em silêncio lê como "coberto".
          # Medido: com 1 nome inexistente, "Total: 7 tests in 1 file", exit 0.
          SPECS="e2e/blocked-attempts.e2e.ts \
                 e2e/blocked-attempts-visual.e2e.ts \
                 e2e/vacancy-kanban.e2e.ts \
                 e2e/vacancy-kanban-eligibility-visual.e2e.ts \
                 e2e/kanban-card-promover-elegivel.e2e.ts"
          for f in $SPECS; do
            [ -f "$f" ] || { echo "::error::spec sumiu ou foi renomeado: $f"; exit 1; }
          done
          npx playwright test --config=playwright.mocked.config.ts --ignore-snapshots $SPECS

      # As fotos sobem SEMPRE, não só na falha: elas são o insumo da comparação
      # de pixel que se faz à mão. Guardá-las apenas quando o job quebra deixaria
      # de fora justamente o caso em que se quer olhar — o verde que está feio.
      - name: Fotos das telas (para comparar com o desenho)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plantillas-telas
          path: enlite-frontend/e2e/__comparador__/app/
          retention-days: 14
          if-no-files-found: warn

      - name: Relatório (só quando falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-integration-report
          path: |
            enlite-frontend/playwright-report/
            enlite-frontend/test-results/
          retention-days: 7

  # ── Job ISOLADO: conferência/envio/sync de horas do Ana Care ──
  #
  # Por que estes specs não entram no job `integration-e2e` acima: eles precisam do engine
  # ABAC LIGADO na API (`PERMISSION_ENGINE_ENABLED=true`,
  # `PERMISSION_ENFORCED_ROUTES=admin.patients`, `PERMISSION_CATALOG_SYNC_ENABLED=true`) e
  # de `ANACARE_HOURS_SOURCE=fake`. O job acima roda TODAS as outras specs `@integration`
  # de propósito com o engine DESLIGADO — ligá-lo ali mudaria o comportamento de specs que
  # hoje não o esperam. Runner do GitHub Actions já isola job por VM própria, então não há
  # disputa de porta/projeto docker com o job acima (os dois usam 5432/8080/5173) — cada um
  # tem a sua.
  #
  # Nota: este job não precisa de `firebase-emulator` nem `fake-gcs` — as specs usam
  # `USE_MOCK_AUTH=true` (interceptação de `identitytoolkit.googleapis.com` via
  # `page.route`, igual às demais specs `@integration`) e não tocam foto/documento. Provado
  # local: a API sobe saudável e a suíte passa só com `postgres` + `api` (sem os outros dois
  # containers) — ver cabeçalho de cada spec.
  #
  # `anacare-hours-sync-real.integration.e2e.ts` (botão "Sincronizar") existia desde antes e
  # NUNCA era executada aqui (achado 20/09: `git grep "sync-real" -- '.github/'` vazio) — um
  # defeito 🔴 de produção (tela enviando um mês e exibindo outro) atravessou por isso. Ela
  # exige DOIS containers DIFERENTES da API por causa do fail-closed do diretório (ver
  # cabeçalho da própria spec):
  #   FELIZ + troca de mês → container com `ANACARE_DIRECTORY_MIN_ABSOLUTE=0` (permissivo).
  #   ERRO                 → container SEM essa env, ainda intocado (nenhum sync bem-sucedido
  #                           rodou nele) — por isso a API é RECRIADA no meio do job, sem
  #                           `ANACARE_SYNC_E2E_ERROR_SCENARIO=1` os outros cenários da spec
  #                           seriam pulados por `test.skip`.
  integration-e2e-anacare-hours:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Sobe Postgres + API (override dedicado — engine ABAC ligado, piso do diretório permissivo)
        working-directory: worker-functions
        run: |
          # `docker-compose.anacare-hours-min-absolute.yml` por cima do override de sempre:
          # só o cenário FELIZ/troca-de-mês do sync precisa do piso em 0 (container nasce sem
          # histórico — sem essa env a 1ª rodada é fail-closed por desenho, ver
          # `AnaCareHoursSyncRunner.assertDirectoryHealthy`). O cenário de ERRO usa o MESMO
          # `docker-compose.anacare-hours.yml` de sempre, SEM este arquivo — a API é recriada
          # mais abaixo, depois dos testes deste bloco.
          BASE="-f docker-compose.yml -f docker-compose.test.yml -f docker-compose.anacare-hours.yml -f docker-compose.anacare-hours-min-absolute.yml"
          docker compose $BASE up -d postgres

          espera() {
            for i in $(seq 1 60); do
              curl -sf "$2" >/dev/null && echo "$1 pronto" && return 0
              sleep 2
            done
            echo "::error::$1 não respondeu em 120s ($2)"
            return 1
          }

          # `postgres` precisa estar pronto para ACEITAR CONEXÃO antes dos dois passos
          # abaixo (migração e marcador) — `depends_on: service_healthy` só protege o
          # container `api`, e esses dois passos não passam por ele.
          for i in $(seq 1 60); do
            docker compose $BASE exec -T postgres pg_isready -U enlite_admin -d enlite_e2e >/dev/null 2>&1 && echo "postgres pronto" && break
            sleep 2
          done

          # Aplica as migrations (cria `iam.rollout_state`, mig 282) SEM subir o
          # servidor: o comando padrão do service `api` (docker-compose.test.yml)
          # encadeia migração + `npm start` num processo só, e o boot da API com o
          # engine ABAC ligado (`PERMISSION_ENGINE_ENABLED=true`, deste override)
          # recusa subir sem o marcador de rollout já presente (`RolloutNotMigratedError`
          # em src/bootstrap/wirePermissionsModule.ts) — precisamos gravar o marcador
          # ANTES de `up -d api`, então rodamos a migração isolada primeiro.
          docker compose $BASE run --rm --no-deps api node scripts/run-migrations-docker.js

          # Marca o rollout de grupos como migrado neste ambiente efêmero — o mesmo
          # marcador que `scripts/iam-config-import.ts --execute` grava em ambiente real
          # (0 staff ativo sem grupo; aqui o banco nasce vazio a cada execução do CI, e
          # o gate de `AssertNoActiveStaffWithoutGroupUseCase` deste job dedicado é a
          # ausência de dado, não a rotina de produção). Grava como owner (`enlite_admin`,
          # via psql dentro do container `postgres`) porque a mig 282 revoga
          # INSERT/UPDATE de `app_runtime`/`app_system` nesta tabela.
          docker compose $BASE exec -T postgres psql -U enlite_admin -d enlite_e2e -c \
            "INSERT INTO iam.rollout_state (key, value, note) VALUES ('permission_groups_migrated', 'done', 'ci:integration-e2e-anacare-hours') ON CONFLICT (key) DO UPDATE SET value = 'done';"

          docker compose $BASE up -d api
          espera "api" http://localhost:8080/health || {
            docker compose $BASE logs api | tail -50
            exit 1
          }

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: enlite-frontend/pnpm-lock.yaml

      - name: Instala dependências
        working-directory: enlite-frontend
        run: pnpm install

      - name: Instala o Chromium do Playwright
        working-directory: enlite-frontend
        run: npx playwright install --with-deps chromium

      - name: Sobe o dev server
        working-directory: enlite-frontend
        env:
          VITE_API_WORKER_FUNCTIONS_URL: http://localhost:8080
          VITE_USE_PUBLIC_JOBS_API: 'true'
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          # Config do Firebase FALSA de propósito — ver comentário equivalente no job
          # `integration-e2e` acima: o helper de auth desta suíte intercepta
          # `identitytoolkit.googleapis.com`/`securetoken.googleapis.com` por `page.route`.
          VITE_FIREBASE_API_KEY: fake-api-key-for-e2e
          VITE_FIREBASE_AUTH_DOMAIN: demo-e2e.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-e2e
          VITE_FIREBASE_STORAGE_BUCKET: demo-e2e.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
        run: |
          pnpm dev > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173/ >/dev/null && echo "vite pronto" && exit 0
            sleep 2
          done
          echo "::error::Vite não respondeu em 120s"
          tail -50 /tmp/vite.log
          exit 1

      - name: Teste de integração — horas do Ana Care, conferência, envio ao Axonico e sync (FELIZ + troca de mês)
        working-directory: enlite-frontend
        env:
          CI: 'true'
        run: npx playwright test --project=integration --ignore-snapshots --grep "anacare-hours-conferencia|anacare-hours-axonico-envio|anacare-hours-sync-real.*(FELIZ|ALTERNATIVO 3)"

      # ── Recria a API para o cenário de ERRO do sync (fail-closed do diretório) ──
      #
      # Precisa de um container "intocado": SEM `ANACARE_DIRECTORY_MIN_ABSOLUTE` E sem
      # nenhum sync bem-sucedido já rodado nele (o passo acima já rodou um, no container
      # anterior) — `AnaCareHoursSyncRunner` fail-closed só dispara na 1ª rodada sem
      # histórico. `--force-recreate` derruba o processo Node (o estado de histórico do
      # diretório é 100% EM MEMÓRIA, `FakeAnaCareDirectorySnapshotRepository` — nunca
      # Postgres, ver cabeçalho da spec) — Postgres e o dev server do Vite continuam de pé,
      # não precisam de novo setup.
      - name: Recria a API sem o piso do diretório (cenário de ERRO do sync)
        working-directory: worker-functions
        run: |
          BASE_ERRO="-f docker-compose.yml -f docker-compose.test.yml -f docker-compose.anacare-hours.yml"
          docker compose $BASE_ERRO up -d --force-recreate --no-deps api

          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/health >/dev/null && echo "api pronto (cenário de erro)" && exit 0
            sleep 2
          done
          echo "::error::api não respondeu em 120s (cenário de erro)"
          docker compose $BASE_ERRO logs api | tail -50
          exit 1

      - name: Teste de integração — sync do Ana Care, cenário de ERRO (fail-closed do diretório)
        working-directory: enlite-frontend
        env:
          CI: 'true'
          ANACARE_SYNC_E2E_ERROR_SCENARIO: '1'
        run: npx playwright test --project=integration --ignore-snapshots --grep "anacare-hours-sync-real.*ALTERNATIVO 2"

      - name: Relatório (só quando falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-integration-report-anacare-hours
          path: |
            enlite-frontend/playwright-report/
            enlite-frontend/test-results/
          retention-days: 7

  # ── Por que este job existe (spec 026, T4.0b) ──
  #
  # O `integration-e2e` padrão sobe a API com `PERMISSION_ENGINE_ENABLED` OFF.
  # `group-simulation.integration.e2e.ts` (F3/T3.6) tem o teste 0 como
  # pré-condição — `enforcement=on, canSimulate=true` — e falha de cara sem o
  # engine ligado. Molde: `integration-e2e-anacare-hours` acima (migração
  # isolada + marcador em `iam.rollout_state` ANTES de `up -d api`, porque
  # `wirePermissionsModule.ts` recusa subir com o engine ligado sem o
  # marcador de rollout já gravado — `RolloutNotMigratedError`). Diferença: o
  # override aqui é `docker-compose.group-simulation.yml` (12 famílias em
  # `PERMISSION_ENFORCED_ROUTES`, não só `admin.patients` do Ana Care), e não
  # há cenário de ERRO que exija recriar a API no meio do job.
  integration-e2e-group-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Sobe Postgres + API (override dedicado — engine ABAC ligado, 12 famílias)
        working-directory: worker-functions
        run: |
          BASE="-f docker-compose.yml -f docker-compose.test.yml -f docker-compose.group-simulation.yml"
          docker compose $BASE up -d postgres

          espera() {
            for i in $(seq 1 60); do
              curl -sf "$2" >/dev/null && echo "$1 pronto" && return 0
              sleep 2
            done
            echo "::error::$1 não respondeu em 120s ($2)"
            return 1
          }

          # `postgres` precisa estar pronto para ACEITAR CONEXÃO antes dos dois passos
          # abaixo (migração e marcador) — `depends_on: service_healthy` só protege o
          # container `api`, e esses dois passos não passam por ele.
          for i in $(seq 1 60); do
            docker compose $BASE exec -T postgres pg_isready -U enlite_admin -d enlite_e2e >/dev/null 2>&1 && echo "postgres pronto" && break
            sleep 2
          done

          # Aplica as migrations (cria `iam.rollout_state`, mig 282) SEM subir o
          # servidor: o comando padrão do service `api` (docker-compose.test.yml)
          # encadeia migração + `npm start` num processo só, e o boot da API com o
          # engine ABAC ligado (`PERMISSION_ENGINE_ENABLED=true`, deste override)
          # recusa subir sem o marcador de rollout já presente (`RolloutNotMigratedError`
          # em src/bootstrap/wirePermissionsModule.ts) — precisamos gravar o marcador
          # ANTES de `up -d api`, então rodamos a migração isolada primeiro.
          docker compose $BASE run --rm --no-deps api node scripts/run-migrations-docker.js

          # Marca o rollout de grupos como migrado neste ambiente efêmero — mesmo
          # marcador que o job `integration-e2e-anacare-hours` grava (banco nasce
          # vazio a cada execução do CI). Grava como owner (`enlite_admin`, via
          # psql dentro do container `postgres`) porque a mig 282 revoga
          # INSERT/UPDATE de `app_runtime`/`app_system` nesta tabela.
          docker compose $BASE exec -T postgres psql -U enlite_admin -d enlite_e2e -c \
            "INSERT INTO iam.rollout_state (key, value, note) VALUES ('permission_groups_migrated', 'done', 'ci:integration-e2e-group-simulation') ON CONFLICT (key) DO UPDATE SET value = 'done';"

          docker compose $BASE up -d api
          espera "api" http://localhost:8080/health || {
            docker compose $BASE logs api | tail -50
            exit 1
          }

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: enlite-frontend/pnpm-lock.yaml

      - name: Instala dependências
        working-directory: enlite-frontend
        run: pnpm install

      - name: Instala o Chromium do Playwright
        working-directory: enlite-frontend
        run: npx playwright install --with-deps chromium

      - name: Sobe o dev server
        working-directory: enlite-frontend
        env:
          VITE_API_WORKER_FUNCTIONS_URL: http://localhost:8080
          VITE_USE_PUBLIC_JOBS_API: 'true'
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          # Config do Firebase FALSA de propósito — ver comentário equivalente no job
          # `integration-e2e` acima: o helper de auth desta suíte intercepta
          # `identitytoolkit.googleapis.com`/`securetoken.googleapis.com` por `page.route`.
          VITE_FIREBASE_API_KEY: fake-api-key-for-e2e
          VITE_FIREBASE_AUTH_DOMAIN: demo-e2e.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-e2e
          VITE_FIREBASE_STORAGE_BUCKET: demo-e2e.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
        run: |
          pnpm dev > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173/ >/dev/null && echo "vite pronto" && exit 0
            sleep 2
          done
          echo "::error::Vite não respondeu em 120s"
          tail -50 /tmp/vite.log
          exit 1

      # `ABAC_API_URL`/`ABAC_TEST_DB_URL` EXPLÍCITOS, não default: a spec (linha 78-80)
      # tem default próprio (8080/5433), mas `abac-stack-helper.ts` — de onde a spec
      # importa `psql`/`scalar`/`grantCell` — lê a MESMA env var com default DIFERENTE
      # (8089/5439, da família de stack local do ABAC). Sem setar aqui, a spec bateria
      # na API certa (8080) mas o `psql()` do helper tentaria a porta 5439, que não
      # existe neste job — silencioso até estourar "connection refused". Porta 5433
      # confirmada em `worker-functions/docker-compose.test.yml` (override de
      # `postgres: ports: 5432:5432` do `docker-compose.yml` base para `5433:5432`,
      # e este job usa os dois arquivos, na ordem em que o segundo vence).
      # `draft-vacancy-page|draft-vacancy-choice` ENTRARAM neste job (não um
      # novo) para não abrir mais um runner: os dois usam `abac-stack-helper`
      # (psql/grantCell/loginAs — usuário REAL gravado em `users`), então
      # sobrevivem ao engine ABAC ligado e herdam o Vite já de pé. `--grep`
      # casa contra a linha inteira do reporter (describe + título + CAMINHO
      # do arquivo), não só o título — confirmado com `--list --grep` (6+5 =
      # 11 testes, mais os 9 de group-simulation = 20 em 3 arquivos).
      # `draft-wizard-locked` NÃO entra aqui:
      # usa token mock simples, sem linha em `users` — sob engine ligado bate
      # em 403 `account_not_active` em qualquer rota `admin.patients`
      # (medido). Vive no job padrão (`pr-gate.yml`, engine OFF).
      # `vacante-anotacao-sem-celula` ENTROU (cadeia, Fase 3): precisa do engine ligado
      # (403 sem `vacancy:update`); usa `abac-stack-helper`.
      - name: Teste de integração — simulação de grupo de acesso + completar-vacante (fases 2-3)
        working-directory: enlite-frontend
        env:
          CI: 'true'
          ABAC_API_URL: http://localhost:8080
          ABAC_TEST_DB_URL: postgresql://enlite_admin:enlite_password@localhost:5433/enlite_e2e
        run: npx playwright test --project=integration --ignore-snapshots --grep "group-simulation|draft-vacancy-page|draft-vacancy-choice|vacante-anotacao-sem-celula"

      - name: Relatório (só quando falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-integration-report-group-simulation
          path: |
            enlite-frontend/playwright-report/
            enlite-frontend/test-results/
          retention-days: 7
