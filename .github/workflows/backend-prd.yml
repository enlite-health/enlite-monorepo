name: Backend — Production

on:
  push:
    branches: [ "main" ]
    paths:
      - 'worker-functions/**'
  # ⚠️ Sem gatilho de `pull_request`: quem roda qualidade em PR é o `pr-gate.yml`
  # (o agregador que sempre reporta e por isso pode ser exigido em branch
  # protection). Deixar o gatilho aqui rodaria a mesma suíte DUAS vezes por PR.

concurrency:
  group: backend-prd
  cancel-in-progress: false

env:
  REGION: southamerica-west1
  REGISTRY_REGION: southamerica-west1
  SERVICE_NAME: worker-functions
  REPOSITORY: worker-functions

jobs:
  quality:
    uses: ./.github/workflows/_backend-quality.yml

  deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: worker-functions

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Create Artifact Registry repo (if needed)'
        run: |
          gcloud artifacts repositories describe ${{ env.REPOSITORY }} \
            --location=${{ env.REGISTRY_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format="value(name)" 2>/dev/null || \
          gcloud artifacts repositories create ${{ env.REPOSITORY }} \
            --repository-format=docker \
            --location=${{ env.REGISTRY_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }}

      - name: 'Docker Auth'
        run: gcloud auth configure-docker ${{ env.REGISTRY_REGION }}-docker.pkg.dev

      - name: 'Validate Dockerfile'
        run: |
          if grep -q 'nginx' Dockerfile; then
            echo "::error::Dockerfile contains 'nginx' — wrong image for backend!"
            exit 1
          fi

      - name: 'Build and Push Container'
        run: |
          IMAGE_TAG="${{ env.REGISTRY_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build --no-cache -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      - name: 'Deploy to Cloud Run'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          image: "${{ env.REGISTRY_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          # ⚠️ SEM `env_vars_update_strategy: overwrite` aqui DE PROPÓSITO (16/08): o YAML de
          # prd NÃO é o conjunto completo — a revisão viva tem envs/secrets aplicados por
          # gcloud fora do YAML (medido no gate do PR #222: 11 envs + 7 secrets a mais no
          # worker-functions; 4 + 1 no MCP). Com overwrite, o 1º deploy os APAGARIA. Antes
          # de ligar overwrite em prd: reconciliar YAML × `gcloud run services describe`
          # (e migrar os plaintext p/ secrets) em PR próprio. Listas de env: usar ';'.
          # ── Promoção stage→main (openspec/changes/promocao-stage-para-main, Fase B):
          # camada ABAC entra DECLARADA e DESLIGADA — `PERMISSION_ENGINE_ENABLED=false` +
          # `COUNTRY_RLS_ENABLED=false` fazem `assertDbRoleMembership`/`rlsAwarePool` ficarem
          # inertes por construção (custo ZERO: nem query nem conexão no pool de sistema —
          # ver `assertDbRoleMembership.ts`). `DB_USER` continua `enlite_app`: só vira
          # `enlite_runtime` na Fase E. `DB_POOL_MAX=20`/`DB_SYSTEM_POOL_MAX=5` são o
          # DEFAULT VIGENTE hoje (`DatabaseConnection.ts` — `DEFAULT_POOL_MAX`/
          # `DEFAULT_SYSTEM_POOL_MAX`), declarado de propósito para não mudar capacidade
          # nesta fase: sem a env, o processo já cai nesse valor. NÃO copiar o 3/1 do stg
          # (db-f1-micro, não comparável) — o dimensionamento real (max_connections=100
          # medido em prd 20/09, `SHOW max_connections`, considerando wf + MCP) é passo 0
          # da Fase E, não desta.
          # spec 022, Bloco 3 (T316, D-15/D-26): só prd, sem par de stg. Bucket criado por
          # terraform/environments/prd/storage.tf (T301-T304) — a env só entra de fato no
          # serviço vivo no deploy do PR final de B5.1 (`flip-de-flag-nao-deploya-sozinho`).
          env_vars: |
            NODE_ENV=production
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            GCS_BUCKET_NAME=enlite-worker-documents
            GCS_PATIENT_PHOTOS_BUCKET=enlite-patient-photos
            PATIENT_DOCUMENTS_BUCKET=enlite-patient-documents
            DB_HOST=/cloudsql/${{ secrets.GCP_PROJECT_ID }}:southamerica-west1:enlite-ar-db
            DB_NAME=enlite_ar
            DB_USER=enlite_app
            DB_SYSTEM_USER=enlite_system
            DB_MIGRATION_USER=enlite_app
            # PERMISSION_ENGINE_ENABLED e PERMISSION_CATALOG_SYNC_ENABLED: ligado em prd em 22/09/2026 via gcloud; YAML alinhado.
            PERMISSION_ENGINE_ENABLED=true
            PERMISSION_CATALOG_SYNC_ENABLED=true
            COUNTRY_RLS_ENABLED=false
            # ⚠️ NÃO troque para `false`. Não é interruptor de criptografia: é saída de emergência
            # de teste. `KMSEncryptionService.ts` e `BlindIndexService.ts` fazem
            # `testMode = NODE_ENV==='test' || USE_KMS_ENCRYPTION==='false'`, e em testMode o
            # encrypt() vira base64 de texto claro e o blind index usa chave fixa. Incidente de
            # 20/09/2026: 21 min com KMS desligado em prd (rev 00492-prl).
            USE_KMS_ENCRYPTION=true
            PERMISSION_ENFORCED_ROUTES=admin.analytics;admin.dedup;admin.encuadre;admin.integrations;admin.messaging;admin.patients;admin.permissions;admin.recruitment;admin.test_fixtures;admin.users;admin.vacancies;admin.workers
            DB_POOL_MAX=20
            DB_SYSTEM_POOL_MAX=5
            TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
            TWILIO_WHATSAPP_NUMBER=${{ secrets.TWILIO_WHATSAPP_NUMBER }}
            TWILIO_STATUS_CALLBACK_URL=https://api.enlite.health/api/webhooks/twilio/status
            TWILIO_INBOUND_WEBHOOK_URL=https://api.enlite.health/api/webhooks/twilio/inbound
            GOOGLE_CALENDAR_IMPERSONATE_EMAIL=enlite@enlite.health
            GOOGLE_CALENDAR_ID=primary
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
            EMAIL_FROM=enlite@enlite.health
            CLOUD_RUN_SERVICE_URL=${{ secrets.CLOUD_RUN_SERVICE_URL }}
            CLOUD_TASKS_QUEUE_LOCATION=southamerica-east1
            GEMINI_MODEL=${{ secrets.GEMINI_MODEL }}
            GEMINI_MODEL_FAST=gemini-2.5-flash
            VERTEX_LOCATION=global
            PROMPT_DOC_ID_AT=1plk1zmW1kUI5kxudci5y1GcwMP5VI9exLe3avH0REGk
            PROMPT_DOC_ID_CUIDADOR=1VSjf02LXjoxsNSNQSl-yDBIwiiu88w6aHW2DnKaUqgA
            MATCHING_RESPECT_AVAILABILITY=true
            ENCUADRE_WEEKLY_CAPACITY=36
            ACCOUNT_LINK_ENABLED=true
            PATIENT_CHAT_LOOKUP_ENABLED=true
            PATIENT_CHAT_IDS_CLICKUP_SYNC_ENABLED=true
            ACCOUNT_LINK_PUBLIC_BASE_URL=https://api.enlite.health
            ADMISSION_CALENDAR_ID_AR=c_2b45b5a65a8cc01085d06a6c7576067dc019716e4448d156482a9060bac97be4@group.calendar.google.com
            ADMISSION_CALENDAR_ID_BR=c_4269afcf3b1a3e84facf0215e4cab5aa48d6286ade21c3aed5240262e418bad8@group.calendar.google.com
            ADMISSION_IMPERSONATE_EMAIL=enlite@enlite.health
            ADMISSION_HOST_ROSTER_ENABLED=true
            TWILIO_TEMPLATE_ADMISSION_CONFIRMATION_ES=HX0ff7a2b0796720e820c4fc0c1f51de7a
            TWILIO_TEMPLATE_ADMISSION_CONFIRMATION_PT=HXbce81c8d53926d61493cb870cb3254b4
            TWILIO_TEMPLATE_ADMISSION_REMINDER_ES=HX85f46263a1b26334b0f389716274d01c
            TWILIO_TEMPLATE_ADMISSION_REMINDER_PT=HX48369d7544b03ed3759a3306b3432d35
            WABA_ID=4410859772526279
            ANACARE_HOURS_SOURCE=real
            ANACARE_DIRECTORY_MIN_ABSOLUTE=226
            CHATWOOT_ACCOUNT_ID=1
            CHATWOOT_MIRROR_ENABLED=true
            CHATWOOT_TWILIO_INBOX_ID=1
            CHATWOOT_URL=https://chatwoot-production-0e81.up.railway.app
            PERISKOPE_PHONE=5491176360496
            PERISKOPE_WEBHOOK_ENABLED=true
            TEMPLATE_SUBMISSION_ENABLED=true
          secrets: |
            DB_PASSWORD=enlite-ar-db-password:latest
            DB_SYSTEM_PASSWORD=enlite-system-db-password:latest
            DB_MIGRATION_PASSWORD=enlite-ar-db-password:latest
            GROQ_API_KEY=groq-api-key:latest
            TWILIO_AUTH_TOKEN=twilio-auth-token:latest
            INTERNAL_TOKEN_SECRET=internal-token-secret:latest
            SENDGRID_API_KEY=sendgrid-api-key:latest
            ACCOUNT_LINK_TOKEN_SECRET=account-link-token-secret:latest
            WABA_TOKEN=waba-token:latest
            GOOGLE_DIRECTIONS_API_KEY=google-directions-api-key:latest
            CLICKUP_API_TOKEN=clickup-api-token:latest
            PERISKOPE_API_KEY=periskope-api-key:latest
            PERISKOPE_WEBHOOK_SECRET=periskope-webhook-secret:latest
            SHORT_IO_API_KEY=short-io-api-key:latest
            SHORT_IO_DOMAIN=short-io-domain:latest
            TWILIO_VERIFY_SERVICE_SID=twilio-verify-service-sid:latest
            ANACARE_USERNAME=anacare-username:latest
            ANACARE_PASS=anacare-pass:latest
          flags: >-
            --allow-unauthenticated
            --service-account=enlite-functions-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --add-cloudsql-instances=${{ secrets.GCP_PROJECT_ID }}:${{ env.REGION }}:enlite-ar-db
            --memory=1Gi
            --cpu=2
            --timeout=600s
            --concurrency=80
            --max-instances=10
            --min-instances=1

      - name: 'Verify deploy (health check)'
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format='value(status.url)')
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$SERVICE_URL/health")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Health check failed with status $STATUS"
            exit 1
          fi
          echo "Health check passed ($STATUS)"

      - name: 'Smoke test — Vertex AI reachable (gera IA)'
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format='value(status.url)')
          SECRET=$(gcloud secrets versions access latest \
            --secret=internal-token-secret \
            --project=${{ secrets.GCP_PROJECT_ID }})
          STATUS=$(curl -s -o /tmp/vertex-health.json -w '%{http_code}' \
            -H "x-internal-secret: $SECRET" \
            "$SERVICE_URL/api/internal/vertex-health")
          echo "Vertex health: $(cat /tmp/vertex-health.json)"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Vertex AI smoke FALHOU ($STATUS) — geração de IA não funcionaria. Cheque roles/aiplatform.user na enlite-functions-sa e disponibilidade do modelo/região."
            exit 1
          fi
          echo "Vertex AI smoke passed ($STATUS)"
