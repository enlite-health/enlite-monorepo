name: Backend MCP — Production

on:
  workflow_run:
    workflows: ["Backend — Production"]
    types: [completed]
    branches: [main]

concurrency:
  group: backend-mcp-prd
  cancel-in-progress: false

env:
  REGION: southamerica-west1
  REGISTRY_REGION: southamerica-west1
  # Service MCP separado — mesma imagem do worker-functions, sem rebuildar
  SERVICE_NAME: worker-functions-mcp
  REPOSITORY: worker-functions

jobs:
  deploy:
    # Só roda quando o backend-prd concluir com sucesso (garante que o image foi publicado)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (worker-functions-mcp)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          # Reusa exatamente o mesmo image buildado pelo backend-prd.yml no mesmo SHA
          image: "${{ env.REGISTRY_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/worker-functions:${{ github.event.workflow_run.head_sha }}"
          env_vars: |
            NODE_ENV=production
            MCP_ENABLED=true
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            DB_HOST=/cloudsql/${{ secrets.GCP_PROJECT_ID }}:southamerica-west1:enlite-ar-db
            DB_NAME=enlite_ar
            DB_USER=enlite_app
            # ⚠️ VÍRGULA ESCAPADA (`\,`) NAS DUAS LINHAS ABAIXO — não é enfeite.
            # A action `deploy-cloudrun` separa `env_vars` por vírgula E por quebra de linha, e
            # documenta: "Keys or values that contain separators must be escaped with a backslash
            # (e.g. `\,`) unless quoted". Sem o escape o valor era PARTIDO e o resto virava env
            # var-lixo de valor vazio. E os DOIS consumidores fazem `.split(',')` no código
            # (`ServicePrincipalSecretManagerRepo.ts:58` e `ExternalMediaDownloader.ts:35`),
            # então separador alternativo (`;`) também não resolve — só piora, virando um
            # elemento único que não casa com nada.
            # Ver `docs/FOLLOWUPS.md` → "MCP: env var com vírgula é partida no deploy".
            # `e2e-prod`: principal de UMA capability (worker.interview.slots.list) do monitor
            # e2e-prod, que prova o fuso do slot recorrente (D213 · Spec 009 · 3.2b).
            MCP_PRINCIPAL_NAMES=triage-service\,claude-code\,e2e-prod
            MCP_DB_RO_USER=enlite_mcp_ro
            MCP_OAUTH_ENABLED=true
            MCP_OAUTH_ISSUER_URL=https://worker-functions-mcp-byh3gvl5yq-tl.a.run.app
            CORS_ALLOWED_ORIGINS=https://worker-functions-mcp-byh3gvl5yq-tl.a.run.app
            FIREBASE_WEB_API_KEY=AIzaSyByRp-NCY0m12iEoKyuIrV6vR49MZateXI
            FIREBASE_WEB_AUTH_DOMAIN=enlite-prd.firebaseapp.com
            ALLOWED_MEDIA_HOSTS=api.twilio.com\,*.twilio.com\,chatwoot.enlite.health
            HANDOVER_NOTIFY_ENABLED=true
            PERISKOPE_GROUP_RECRUITMENT_ID=120363334377379340@g.us
            PERISKOPE_NOTE_AUTHOR=enlite@enlite.health
          secrets: |
            DB_PASSWORD=enlite-ar-db-password:latest
            INTERNAL_TOKEN_SECRET=internal-token-secret:latest
            MCP_OAUTH_SIGNING_KEY=mcp-oauth-signing-key:latest
            MCP_DB_RO_PASSWORD=enlite-mcp-ro-db-password:latest
          flags: >-
            --ingress=all
            --allow-unauthenticated
            --service-account=enlite-functions-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --add-cloudsql-instances=${{ secrets.GCP_PROJECT_ID }}:${{ env.REGION }}:enlite-ar-db
            --memory=1Gi
            --cpu=1
            --timeout=60s
            --concurrency=80
            --min-instances=0
            --max-instances=5

      - name: Verify deploy (health check via gcloud — ingress=internal, sem curl direto)
        run: |
          STATUS=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format='value(status.conditions[0].type)')
          if [ "$STATUS" != "Ready" ]; then
            echo "::error::Service ${{ env.SERVICE_NAME }} não ficou Ready (status: $STATUS)"
            exit 1
          fi
          echo "Service ${{ env.SERVICE_NAME }} Ready"
