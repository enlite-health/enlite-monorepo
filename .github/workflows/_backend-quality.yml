name: Backend Quality Gate (reusable)

on:
  workflow_call:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker-functions

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker-functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      # `--coverage` NÃO é enfeite: sem coletar cobertura o jest ignora
      # `coverageThreshold` por completo, e o piso per-file do jest.config.js
      # vira documentação. Medido: `jest <suite>` sai 0 com o piso violado,
      # `jest <suite> --coverage` sai 1. Quem executa a trava é esta linha.
      - name: Run unit tests (com o piso de cobertura)
        run: npm test -- --coverage
