name: E2E Tests — Worker Functions

# Chamado pelo `pr-gate.yml` nos PRs (é lá que ele vira check exigível) e
# disparado direto no `push` das branches protegidas, para carimbar o commit que
# de fato ficou na branch.
#
# ⚠️ Conflito resolvido a favor DESTA versão no sync main→stage (19/08). A `stage`
# tinha a solução anterior (#229): gatilho `pull_request` próprio incluindo
# `stage`, criado porque o e2e só rodava no fluxo de produção e os 3 arquivos e2e
# do #226 nunca tinham rodado no CI. Aquele PROPÓSITO continua atendido — o
# `pr-gate.yml` dispara em PR para `main` E `stage` e chama este workflow — e o
# gatilho próprio agora só causaria a suíte de ~15 min rodando DUAS vezes por PR.
#
# ⚠️ NÃO tem mais gatilho de `pull_request` próprio: com ele o PR rodaria a
# suíte de ~15 min DUAS vezes (uma pelo gatilho, outra pelo agregador).
on:
  push:
    branches: [ "main", "stage" ]
    paths:
      - 'worker-functions/**'
  workflow_call:

# Cancela corrida superada da MESMA ref. Em `push` de branch protegida isso não
# se aplica na prática (um commit por vez), e no PR quem cancela é o pr-gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    # 15 min não bastava: no PR #299 o job foi cancelado no teto com 181 de 182 suítes
    # concluídas, e agora entram o boot do container da OMS (~16 s) e a ingestão (~13 s
    # medidos localmente). O teto é rede de segurança contra travamento, não orçamento.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worker-functions

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker-functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate test fixtures
        run: npm run test:e2e:fixtures

      # Sobe ANTES do stack para o boot de ~15 s correr em paralelo com o do Postgres/API.
      # ⚠️ Baixa 111 MB da nuvem da OMS a cada cold start (medido na F0) — se a OMS estiver
      # fora, este passo falha ALTO e a suíte não roda. É deliberado: catálogo ausente fazia
      # 11 suítes reprovarem com uma mensagem que parecia defeito de código.
      - name: Start ICD-11 API (catálogo da OMS)
        run: |
          docker run -d --name icd-api -p 8085:80 \
            -e acceptLicense=true -e saveAnalytics=false -e include=2026-01_en-es \
            whoicd/icd-api

      # `fake-gcs` sobe junto (spec 018 PR-4 — conserto #1 da 2ª revisão): antes disto o CI nunca
      # tinha storage nenhum de pé, e `patient-photo-and-documents.e2e.test.ts` (achado 7 da
      # revisão anterior) nunca rodava aqui — só existia caminho local, manual.
      - name: Start Docker stack
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d postgres api fake-gcs

      - name: Wait for fake-gcs
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:54443/storage/v1/b >/dev/null && { echo "fake-gcs pronto"; exit 0; }
            sleep 2
          done
          echo "::error::fake-gcs não respondeu em 60s"
          docker compose -f docker-compose.yml -f docker-compose.test.yml logs fake-gcs
          exit 1

      - name: Wait for API health
        run: node scripts/wait-for-health.js
        env:
          API_URL: http://localhost:8080
          HEALTH_TIMEOUT_MS: 90000

      # As migrations rodam no boot do container da API (`run-migrations-docker.js && npm start`),
      # então o schema `terminology` já existe quando este passo começa.
      - name: Ingest + promote ICD-11 catalog
        run: |
          set -euo pipefail
          echo "Aguardando o container da OMS responder..."
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -m 5 -w '%{http_code}' \
              -H 'API-Version: v2' -H 'Accept-Language: es' -H 'Accept: application/json' \
              "$ICD11_API_BASE" || echo 000)
            [ "$code" = "200" ] && { echo "ICD-11 API pronta em ~$((i*5))s"; break; }
            [ "$i" = "60" ] && { echo "::error::ICD-11 API não respondeu 200 em 300s"; docker logs icd-api | tail -30; exit 1; }
            sleep 5
          done
          ./node_modules/.bin/ts-node --transpile-only scripts/ingest-icd11-catalog.ts --release 2026-01 --concurrency 32
          ./node_modules/.bin/ts-node --transpile-only scripts/ingest-icd11-catalog.ts --promote 2026-01 --by ci
          # Contagem zero é falha, nunca sucesso: as suítes do CID-11 exigem >= 30000 linhas e
          # o release CORRENTE. Sem esta asserção, um catálogo vazio viraria 11 reprovações
          # com mensagem de defeito de código, que foi exatamente o que aconteceu no PR #299.
          docker compose -f docker-compose.yml -f docker-compose.test.yml exec -T postgres \
            psql -U enlite_admin -d enlite_e2e -v ON_ERROR_STOP=1 -c \
            "DO \$\$ DECLARE n int; c int; BEGIN
               SELECT count(*) INTO n FROM terminology.icd_entities;
               SELECT count(*) INTO c FROM terminology.icd_releases WHERE is_current;
               IF n < 30000 THEN RAISE EXCEPTION 'catalogo CID-11 com % linhas (< 30000)', n; END IF;
               IF c <> 1 THEN RAISE EXCEPTION 'releases correntes = % (esperado 1)', c; END IF;
               RAISE NOTICE 'catalogo CID-11 pronto: % entidades, 1 release corrente', n;
             END \$\$;"
        env:
          ICD11_API_BASE: http://localhost:8085/icd/release/11/2026-01/mms
          DATABASE_URL: postgresql://enlite_admin:enlite_password@localhost:5433/enlite_e2e

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          API_URL: http://localhost:8080
          DATABASE_URL: postgresql://enlite_admin:enlite_password@localhost:5433/enlite_e2e
          INTERNAL_TOKEN_SECRET: test-secret-for-e2e-only
          # Spec 018 PR-4 (foto/documento do paciente) — conserto #1 da 2ª revisão:
          # `patient-photo-and-documents.e2e.test.ts` monta o app EM PROCESSO (não fala com o
          # container `api`) e usa o `@google-cloud/storage` REAL contra este fake-gcs.
          GCS_EMULATOR_HOST: http://localhost:54443
          GCS_PATIENT_PHOTOS_BUCKET: enlite-patient-photos-pr4test
          GCS_PATIENT_DOCUMENTS_BUCKET: enlite-patient-documents-pr4test

      # ── Fronteira staff × prestador com TOKEN REAL (D294) ──
      #
      # A suíte principal roda a API em modo mock (`USE_MOCK_AUTH=true`). Esta é
      # a prova SEM mock: um segundo projeto do compose (`-p realauth`) sobe o
      # emulador do Firebase e a API com `USE_MOCK_AUTH=false`; a conta nasce no
      # emulador, o claim `account_type` é gravado pela API administrativa e o
      # ID token sai de um login real. A varredura pega TODAS as rotas do
      # inventário vivo e exige que um prestador nunca obtenha 2xx. A suíte
      # FALHA (não pula) se o stack não estiver de pé — silêncio não é verde.
      #
      # `api` sobe com `--no-deps` pelo mesmo motivo do job do frontend: o
      # healthcheck do emulador fica `unhealthy` mesmo servindo 200.
      - name: Sobe stack REAL (emulador Firebase + API sem mock)
        run: |
          set -euo pipefail
          REAL="-p realauth -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.firebase.yml -f docker-compose.real-auth-ports.yml"
          docker compose $REAL up -d postgres firebase-emulator
          for i in $(seq 1 60); do
            curl -sf http://localhost:9099/ >/dev/null && { echo "emulador pronto"; break; }
            [ "$i" = "60" ] && { echo "::error::emulador Firebase não respondeu em 120s"; docker compose $REAL logs firebase-emulator | tail -50; exit 1; }
            sleep 2
          done
          docker compose $REAL up -d --no-deps api
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/health >/dev/null && { echo "api real pronta"; break; }
            [ "$i" = "60" ] && { echo "::error::API real não respondeu em 120s"; docker compose $REAL logs api | tail -50; exit 1; }
            sleep 2
          done

      - name: E2E com token REAL — prestador nunca entra no painel
        run: npm run test:e2e:real-auth
        env:
          API_REAL_URL: http://localhost:8081
          DATABASE_URL: postgresql://enlite_admin:enlite_password@localhost:5440/enlite_e2e
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          INTERNAL_TOKEN_SECRET: test-secret-for-e2e-only

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml logs api
          echo "--- api real ---"; docker compose -p realauth -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.firebase.yml -f docker-compose.real-auth-ports.yml logs api 2>&1 | tail -60 || true
          echo "--- icd-api ---"; docker logs icd-api 2>&1 | tail -40 || true
          echo "--- fake-gcs ---"; docker compose -f docker-compose.yml -f docker-compose.test.yml logs fake-gcs 2>&1 | tail -40 || true

      - name: Teardown
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml down -v
          docker compose -p realauth -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.firebase.yml -f docker-compose.real-auth-ports.yml down -v || true
          docker rm -f icd-api || true
