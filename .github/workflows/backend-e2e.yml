name: E2E Tests — Worker Functions

# ⚠️ `stage` entra junto com `main` (17/08/2026). Até aqui o e2e só rodava no
# fluxo de PRODUÇÃO — e o fluxo real de trabalho do ABAC/painel de grupos é PR
# para `stage`. Resultado concreto: o PR #226 levou 3 arquivos e2e novos (20
# casos, banco e API reais) que NUNCA rodaram no CI; rodaram só na máquina de
# quem escreveu. "E2E sem mock" era critério do gate de revisão e hábito de
# quem lembrava, não camada.
on:
  push:
    branches: [ "main", "stage" ]
    paths:
      - 'worker-functions/**'
  pull_request:
    branches: [ "main", "stage" ]
    paths:
      - 'worker-functions/**'

# Cancela corridas SUPERSEDIDAS do mesmo PR (push novo enquanto a suíte de ~15
# min ainda roda). NÃO cancela em `push`: um merge em `main`/`stage` tem que
# concluir o e2e — cancelar ali deixaria um commit de produção sem prova, e é
# por isso que os 5 workflows da casa usam `cancel-in-progress: false`.
#
# ⚠️ Isto NÃO deduplica PR × push do mesmo merge: os dois eventos têm `ref`
# diferente (`refs/pull/<N>/merge` × `refs/heads/stage`), então continuam sendo
# duas corridas — de propósito, porque a do push é a que carimba o commit que
# ficou na branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker-functions

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker-functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate test fixtures
        run: npm run test:e2e:fixtures

      - name: Start Docker stack
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d postgres api

      - name: Wait for API health
        run: node scripts/wait-for-health.js
        env:
          API_URL: http://localhost:8080
          HEALTH_TIMEOUT_MS: 90000

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          API_URL: http://localhost:8080
          DATABASE_URL: postgresql://enlite_admin:enlite_password@localhost:5433/enlite_e2e
          INTERNAL_TOKEN_SECRET: test-secret-for-e2e-only

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml logs api

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v
